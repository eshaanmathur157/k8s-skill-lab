apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spotify-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: spotify-api
    spec:
      # Spread the copies across nodes when possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spotify-api
      containers:
        - name: api
          image: spotify-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          # Keep serving for 5 seconds after removal from the Service, so no request is cut off.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
