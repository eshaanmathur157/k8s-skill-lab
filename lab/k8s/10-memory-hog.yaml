apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
spec:
  containers:
    - name: hog
      image: python:3.12-slim
      imagePullPolicy: IfNotPresent
      # Tries to use 200 MiB while the limit is 64 MiB.
      command: ["python", "-c", "x = bytearray(200 * 1024 * 1024); import time; time.sleep(3600)"]
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
