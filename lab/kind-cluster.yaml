# One control-plane node and two worker nodes. Each node is a Docker container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraPortMappings:
      # Lets you reach the NodePort service at localhost:30080
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "0.0.0.0"
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
